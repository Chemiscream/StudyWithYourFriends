<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>登录 - 学习记录</title>
<style>
:root {
  --bg: #f0f4fa;
  --panel: #fbfcfe;
  --panel-soft: #f4f7fc;
  --ink: #1a2435;
  --muted: #6b7a8d;
  --line: #d8e2ef;
  --line-strong: #b8c8db;
  --primary: #4a90d9;
  --primary-dark: #2d6cb5;
  --primary-soft: #e0edfa;
  --danger: #b83b3b;
  --success: #0f9f6e;
  --shadow: 0 18px 44px rgba(26, 36, 53, .09);
  --radius: 8px;
  --font: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
}
html[data-theme="dark"] {
  --bg: #08111f;
  --panel: #111d2d;
  --panel-soft: #0d1726;
  --ink: #e8f1ff;
  --muted: #91a3bb;
  --line: #22344d;
  --line-strong: #38516e;
  --primary: #49a7ff;
  --primary-dark: #8ecbff;
  --primary-soft: rgba(73, 167, 255, .16);
  --danger: #ff7b7b;
  --success: #49df9d;
  --shadow: 0 22px 54px rgba(0, 0, 0, .30);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font);
  background:
    radial-gradient(circle at 22% 0%, rgba(74, 144, 217, .12), transparent 30%),
    radial-gradient(circle at 88% 8%, rgba(74, 144, 217, .10), transparent 30%),
    linear-gradient(90deg, rgba(74, 144, 217, .045) 1px, transparent 1px),
    linear-gradient(180deg, rgba(74, 144, 217, .04) 1px, transparent 1px),
    linear-gradient(135deg, #f8fafd 0%, var(--bg) 48%, #e8eef8 100%);
  background-size: auto, auto, 44px 44px, 44px 44px, auto;
}
html[data-theme="dark"] body {
  background:
    radial-gradient(circle at 20% 0%, rgba(73, 167, 255, .16), transparent 32%),
    radial-gradient(circle at 82% 4%, rgba(52, 211, 153, .10), transparent 30%),
    linear-gradient(90deg, rgba(90, 145, 220, .08) 1px, transparent 1px),
    linear-gradient(180deg, rgba(90, 145, 220, .06) 1px, transparent 1px),
    linear-gradient(135deg, #07101d 0%, #08111f 56%, #0d1726 100%);
}
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .6; }
h1, p { margin: 0; }

.auth-wrap {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.auth-card {
  width: 100%;
  max-width: 420px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  box-shadow: var(--shadow);
}
html[data-theme="dark"] input { background: #0d1726; }
.auth-logo {
  width: 56px; height: 56px;
  margin: 0 auto 14px;
  border-radius: 16px;
  background: linear-gradient(135deg, #4a90d9, #7b5cff);
  display: grid; place-items: center;
  color: #fff; font-size: 26px; font-weight: 800;
  box-shadow: 0 12px 28px rgba(74, 144, 217, .28);
}
.auth-card h1 { text-align: center; font-size: 22px; }
.auth-card .sub { text-align: center; color: var(--muted); font-size: 13px; margin-top: 6px; }
.auth-tabs {
  display: flex; gap: 6px;
  margin: 22px 0 16px;
  padding: 4px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--panel-soft);
}
.auth-tabs button {
  flex: 1; min-height: 36px;
  border: 0; border-radius: 999px;
  background: transparent; color: var(--muted);
  font-weight: 700;
}
.auth-tabs button.active {
  background: var(--primary); color: #fff;
  box-shadow: 0 6px 14px rgba(74, 144, 217, .22);
}
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 700; color: #2c3d52; }
.field label span { display: block; margin-bottom: 6px; color: var(--ink); }
input {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 8px 12px;
  background: #fff;
  color: var(--ink);
  outline: none;
  transition: border-color .16s ease, box-shadow .16s ease;
}
html[data-theme="dark"] input { background: #0d1726; }
input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(74, 144, 217, .14);
}
.primary-btn {
  width: 100%; min-height: 44px;
  border: 0; border-radius: 10px;
  background: var(--primary); color: #fff;
  font-weight: 700; font-size: 15px;
  box-shadow: 0 12px 24px rgba(74, 144, 217, .22);
  transition: background .18s ease, transform .18s ease;
}
.primary-btn:hover { background: var(--primary-dark); }
.primary-btn:active { transform: translateY(1px); }
.msg { min-height: 20px; margin-top: 12px; text-align: center; font-size: 13px; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--success); }
.back-link {
  display: block; text-align: center; margin-top: 16px;
  color: var(--muted); font-size: 13px; text-decoration: none;
}
.back-link:hover { color: var(--primary); }

@media (max-width: 480px) {
  .auth-wrap { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .auth-card { padding: 22px 18px; }
  .auth-logo { width: 48px; height: 48px; font-size: 22px; }
  .auth-card h1 { font-size: 19px; }
  input { min-height: 46px; font-size: 16px; }
  .primary-btn { min-height: 48px; font-size: 16px; }
  .auth-tabs button { min-height: 40px; font-size: 14px; }
}
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">学</div>
    <h1>学习记录</h1>
    <p class="sub">记录每天的学习，和伙伴一起成长</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" type="button">登录</button>
      <button id="tabReg" type="button">注册</button>
    </div>
    <div class="field"><label><span>用户名（角色）</span><input id="authUser" autocomplete="username"></label></div>
    <div class="field"><label><span>密码</span><input id="authPwd" type="password" autocomplete="current-password"></label></div>
    <button id="authBtn" class="primary-btn" type="button">登录</button>
    <div id="authMsg" class="msg"></div>
    <a class="back-link" href="/">← 返回首页</a>
  </div>
</div>

<script>
function applyTheme(t) {
  if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme(localStorage.getItem("studylog_theme") || "light");

let mode = "login";
const tabLogin = document.getElementById("tabLogin");
const tabReg = document.getElementById("tabReg");
const authBtn = document.getElementById("authBtn");
const authMsg = document.getElementById("authMsg");

function setMode(m) {
  mode = m;
  tabLogin.classList.toggle("active", m === "login");
  tabReg.classList.toggle("active", m === "register");
  authBtn.textContent = m === "login" ? "登录" : "注册";
  authMsg.textContent = "";
}
tabLogin.onclick = () => setMode("login");
tabReg.onclick = () => setMode("register");

async function doAuth() {
  const u = document.getElementById("authUser").value.trim();
  const p = document.getElementById("authPwd").value;
  if (!u || !p) { authMsg.className = "msg err"; authMsg.textContent = "请输入用户名和密码"; return; }
  authMsg.textContent = "…"; authMsg.className = "msg";
  try {
    const res = await (await fetch(mode === "login" ? "/api/login" : "/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    })).json();
    if (res.ok) {
      localStorage.setItem("studylog_token", res.token);
      localStorage.setItem("studylog_user", res.username);
      authMsg.className = "msg ok"; authMsg.textContent = "成功，正在返回…";
      setTimeout(() => { location.href = "/"; }, 400);
    } else {
      authMsg.className = "msg err"; authMsg.textContent = res.message || "操作失败";
    }
  } catch (e) {
    authMsg.className = "msg err"; authMsg.textContent = "网络错误";
  }
}
authBtn.onclick = doAuth;
["authUser", "authPwd"].forEach(id => {
  document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });
});
</script>
</body>
</html>
