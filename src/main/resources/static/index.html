<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>学习记录</title>
<style>
:root {
  --bg: #f0f4fa;
  --panel: #fbfcfe;
  --panel-soft: #f4f7fc;
  --ink: #1a2435;
  --muted: #6b7a8d;
  --line: #d8e2ef;
  --line-strong: #b8c8db;
  --primary: #4a90d9;
  --primary-dark: #2d6cb5;
  --primary-soft: #e0edfa;
  --danger: #b83b3b;
  --success: #0f9f6e;
  --warn: #a76500;
  --shadow: 0 18px 44px rgba(26, 36, 53, .09);
  --shadow-soft: 0 8px 22px rgba(26, 36, 53, .06);
  --radius: 8px;
  --font: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
  --mono: "Consolas", "Courier New", monospace;
}
html[data-theme="dark"] {
  --bg: #08111f;
  --panel: #111d2d;
  --panel-soft: #0d1726;
  --ink: #e8f1ff;
  --muted: #91a3bb;
  --line: #22344d;
  --line-strong: #38516e;
  --primary: #49a7ff;
  --primary-dark: #8ecbff;
  --primary-soft: rgba(73, 167, 255, .16);
  --danger: #ff7b7b;
  --success: #49df9d;
  --warn: #f5b74f;
  --shadow: 0 22px 54px rgba(0, 0, 0, .30);
  --shadow-soft: 0 14px 34px rgba(0, 0, 0, .22);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font);
  background:
    radial-gradient(circle at 22% 0%, rgba(74, 144, 217, .12), transparent 30%),
    radial-gradient(circle at 88% 8%, rgba(74, 144, 217, .10), transparent 30%),
    linear-gradient(90deg, rgba(74, 144, 217, .045) 1px, transparent 1px),
    linear-gradient(180deg, rgba(74, 144, 217, .04) 1px, transparent 1px),
    linear-gradient(135deg, #f8fafd 0%, var(--bg) 48%, #e8eef8 100%);
  background-size: auto, auto, 44px 44px, 44px 44px, auto;
}
html[data-theme="dark"] body {
  background:
    radial-gradient(circle at 20% 0%, rgba(73, 167, 255, .16), transparent 32%),
    radial-gradient(circle at 82% 4%, rgba(52, 211, 153, .10), transparent 30%),
    linear-gradient(90deg, rgba(90, 145, 220, .08) 1px, transparent 1px),
    linear-gradient(180deg, rgba(90, 145, 220, .06) 1px, transparent 1px),
    linear-gradient(135deg, #07101d 0%, #08111f 56%, #0d1726 100%);
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .6; }
h1, h2, h3, p { margin: 0; }

.shell { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

header.app-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 20px;
}
.app-bar .brand { display: flex; align-items: center; gap: 12px; }
.app-bar .brand-mark {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, #4a90d9, #7b5cff);
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px;
  box-shadow: 0 10px 22px rgba(74, 144, 217, .24);
}
.app-bar h1 { font-size: 22px; }
.app-bar .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.user-area { display: flex; align-items: center; gap: 8px; }
.user-tag {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 32px; padding: 0 12px;
  border-radius: 999px;
  background: var(--primary-soft); color: var(--primary-dark);
  font-size: 13px; font-weight: 700;
}
.icon-btn {
  width: 36px; height: 36px; min-height: 36px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--muted);
  font-size: 16px;
}
.icon-btn:hover { border-color: var(--primary); color: var(--primary-dark); }

#colorPickerWrap { position: relative; }
#colorBtn {
  width: 36px; height: 36px; min-height: 36px;
  border: 0; border-radius: 50%;
  background: transparent;
  padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
}
#colorBtn:hover { opacity: .85; }
#colorDot {
  width: 28px; height: 28px; border-radius: 50%;
  display: block;
  box-shadow: 0 0 0 2px var(--panel), 0 2px 8px rgba(0,0,0,.15);
}
.color-palette {
  position: absolute; top: 44px; right: 0;
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 8px; padding: 12px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow);
  z-index: 100; width: 190px;
}
.color-palette[hidden] { display: none !important; }
.color-palette button {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; padding: 0;
  transition: transform .12s ease;
}
.color-palette button:hover { transform: scale(1.15); }
.color-palette button.active { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel); }

.panel {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow-soft);
  margin-bottom: 16px;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.panel-head h2 { font-size: 16px; }

.filter-bar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
}
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 700; color: #2c3d52; }
.field label span { display: block; margin-bottom: 6px; color: var(--ink); }
.filter-bar .field { margin: 0; flex: 1 1 160px; min-width: 0; }
.filter-bar .field.date { flex: 1 1 130px; }
input, textarea {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 8px 12px;
  background: #fff;
  color: var(--ink);
  outline: none;
  transition: border-color .16s ease, box-shadow .16s ease;
}
html[data-theme="dark"] input, html[data-theme="dark"] textarea { background: #0d1726; }
html[data-theme="dark"] .btn { background: #1a2a3e; border-color: var(--line); color: var(--primary); }
html[data-theme="dark"] .btn:hover { background: #22364d; }
html[data-theme="dark"] .btn.danger, html[data-theme="dark"] .del-btn { background: #3a1d1d; border-color: #5a2a2a; color: var(--danger); }
html[data-theme="dark"] .btn.danger:hover { background: #4a2424; }
html[data-theme="dark"] .del-btn:hover { background: #4a2424; }
html[data-theme="dark"] .btn.ghost { background: transparent; }
input:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(74, 144, 217, .14);
}
textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
.editor {
  min-height: 110px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 10px 12px;
  background: #fff;
  color: var(--ink);
  line-height: 1.7;
  outline: none;
  cursor: text;
  transition: border-color .16s ease, box-shadow .16s ease;
}
html[data-theme="dark"] .editor { background: #0d1726; }
.editor:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(74, 144, 217, .14);
}
.editor:empty::before {
  content: attr(data-placeholder);
  color: var(--muted);
  pointer-events: none;
}
.editor img {
  max-width: 100%;
  max-height: 240px;
  border-radius: 8px;
  vertical-align: middle;
  margin: 4px 2px;
  cursor: pointer;
}
.editor img:hover { outline: 2px solid var(--danger); outline-offset: 2px; }
.btn {
  min-height: 42px; padding: 0 16px;
  border: 1px solid var(--line-strong); border-radius: 10px;
  background: #f3f7fc; color: var(--primary-dark);
  font-weight: 700;
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.btn:hover { border-color: rgba(74, 144, 217, .42); background: #eaf3fc; }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--primary); color: #fff; border-color: var(--primary);
  box-shadow: 0 8px 18px rgba(74, 144, 217, .2);
}
.btn.primary:hover { background: var(--primary-dark); color: #fff; }
.btn.danger {
  background: #fff3f3; color: var(--danger); border-color: #ecc4c4;
}
.btn.danger:hover { background: #ffe5e5; }
.btn.ghost { background: transparent; }

.record-list { display: grid; gap: 12px; }
.record {
  padding: 16px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--primary);
  border-radius: var(--radius);
  background: var(--panel);
  transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}
.record:hover { border-color: color-mix(in srgb, var(--primary) 30%, var(--line)); box-shadow: var(--shadow-soft); }
.record.mine { background: linear-gradient(135deg, rgba(15, 159, 110, .05), var(--panel) 60%); }
.record-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.record-user { display: flex; align-items: center; gap: 8px; }
.role-tag {
  display: inline-flex; align-items: center;
  min-height: 26px; padding: 0 10px;
  border-radius: 999px;
  background: var(--primary-soft); color: var(--primary-dark);
  font-size: 12px; font-weight: 800;
}
.record-time { color: var(--muted); font-size: 12px; }
.record-content {
  color: var(--ink); line-height: 1.7; font-size: 14px;
  white-space: pre-wrap; word-break: break-word;
}
.record-content img {
  max-width: 100%; max-height: 360px;
  border-radius: 10px; margin: 6px 0;
  cursor: zoom-in;
  display: block;
}
.record-image {
  margin-top: 10px;
  max-width: 100%;
  max-height: 360px;
  border-radius: 10px;
  border: 1px solid var(--line);
  cursor: zoom-in;
  object-fit: contain;
  background: var(--panel-soft);
}
.record-image:hover { border-color: var(--primary); }
.record-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.edit-btn {
  min-height: 30px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--panel-soft); color: var(--primary-dark);
  font-size: 12px; font-weight: 700;
}
.edit-btn:hover { border-color: var(--primary); }
.del-btn {
  min-height: 30px; padding: 0 12px;
  border: 1px solid #ecc4c4; border-radius: 8px;
  background: #fff3f3; color: var(--danger);
  font-size: 12px; font-weight: 700;
}
.del-btn:hover { background: #ffe5e5; }
.empty {
  padding: 40px 20px; text-align: center; color: var(--muted);
  border: 1px dashed var(--line-strong); border-radius: var(--radius);
  background: var(--panel-soft);
}
.msg { min-height: 20px; margin-top: 12px; text-align: center; font-size: 13px; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--success); }

.stats-sub { font-size: 14px; color: var(--muted); margin: 14px 0 10px; }
.rank-list { display: grid; gap: 8px; }
.rank-row { display: flex; align-items: center; gap: 10px; }
.rank-name {
  flex: 0 0 90px; max-width: 90px;
  font-size: 13px; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rank-bar-wrap { flex: 1; height: 22px; background: var(--panel-soft); border-radius: 6px; overflow: hidden; }
.rank-bar { height: 100%; min-width: 2px; border-radius: 6px; transition: width .5s ease; }
.rank-count { flex: 0 0 40px; text-align: right; font-size: 13px; font-weight: 700; color: var(--muted); }
.rank-empty { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
.cloud-canvas { width: 100%; height: 320px; display: block; }

/* 留言 */
.comments { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; display: grid; gap: 6px; }
.comment-item { display: flex; align-items: baseline; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.comment-text { flex: 1; min-width: 0; word-break: break-word; color: var(--text); }
.comment-time { font-size: 11px; color: var(--muted); white-space: nowrap; }
.comment-del { border: none; background: none; color: var(--danger); cursor: pointer; font-size: 12px; padding: 0 2px; border-radius: 4px; }
.comment-del:hover { background: var(--danger-soft); }
.comment-form { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
.comment-form .input { flex: 1; min-width: 0; height: 38px; padding: 8px 12px; font-size: 13px; }
.comment-form .btn { height: 38px; min-height: 38px; padding: 0 14px; font-size: 13px; }
.comment-empty { font-size: 12px; color: var(--muted); }
.reply-badge { font-size: 12px; color: var(--muted); }
.reply-badge b { color: var(--primary-dark); font-weight: 700; }
.comment-reply { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 2px; border-radius: 4px; }
.comment-reply:hover { color: var(--primary-dark); background: var(--primary-soft); }
.reply-state { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--primary-dark); }
.reply-state .reply-cancel { border: none; background: none; color: var(--danger); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 4px; }

/* 更新日志弹窗 */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(10, 20, 35, .45);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-card {
  width: min(440px, 94vw); max-height: 80vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow); padding: 22px;
}
.modal-card h2 { font-size: 18px; margin-bottom: 12px; }
.modal-card ul { margin: 0 0 18px; padding-left: 20px; }
.modal-card li { font-size: 13.5px; line-height: 1.75; color: var(--ink); }
.modal-card .btn { width: 100%; min-height: 40px; }
.ver-tag { display: block; text-align: center; color: var(--muted); font-size: 11px; margin-top: 28px; user-select: none; }

/* emoji 面板 */
.emoji-panel {
  position: fixed; z-index: 60;
  width: min(320px, 92vw);
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(23,43,77,.18);
  padding: 10px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
}
.emoji-panel[hidden] { display: none !important; }
.emoji-item {
  border: none; background: none; cursor: pointer;
  font-size: 20px; line-height: 1; padding: 6px 0; border-radius: 6px;
}
.emoji-item:hover { background: var(--panel-soft); }
html[data-theme="dark"] .emoji-panel { box-shadow: 0 8px 24px rgba(0,0,0,.4); }

@media (max-width: 600px) {
  .shell { padding: 16px 12px calc(40px + env(safe-area-inset-bottom)); }
  .app-bar { flex-wrap: wrap; gap: 8px; align-items: center; }
  .app-bar .brand-mark { width: 34px; height: 34px; font-size: 16px; }
  .app-bar h1 { font-size: 17px; }
  .app-bar .sub { display: none; }
  .user-area { flex: 1 1 100%; justify-content: flex-end; flex-wrap: wrap; gap: 6px; align-items: center; }
  .user-tag { font-size: 12px; padding: 0 10px; min-height: 32px; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #colorBtn { width: 32px; height: 32px; min-height: 32px; }
  #colorDot { width: 26px; height: 26px; }
  .filter-bar .field { flex: 1 1 100%; }
  .btn { min-height: 40px; white-space: nowrap; }
  .icon-btn { width: 32px; height: 32px; min-height: 32px; }
  .panel { padding: 14px; margin-bottom: 12px; }
  .record { padding: 14px; }
  .record-content { font-size: 15px; }
  .record-image { max-height: 260px; }
  #loginBtn, #logoutBtn { min-height: 32px; padding: 0 12px; font-size: 13px; }
}

@media (max-width: 380px) {
  .shell { padding: 12px 10px calc(32px + env(safe-area-inset-bottom)); }
  .app-bar h1 { font-size: 16px; }
  .user-tag { font-size: 12px; padding: 0 10px; }
  .panel-head h2 { font-size: 15px; }
}
</style>
</head>
<body>

<div class="shell">
  <header class="app-bar">
    <div class="brand">
      <div class="brand-mark">学</div>
      <div>
        <h1>学习记录</h1>
        <div class="sub">所有用户的学习动态</div>
      </div>
    </div>
    <div class="user-area">
        <span id="userTag" class="user-tag" hidden></span>
        <div id="colorPickerWrap" hidden>
          <button id="colorBtn" type="button" title="我的主题色">
            <span id="colorDot"></span>
          </button>
          <div id="colorPalette" class="color-palette" hidden></div>
        </div>
        <a id="loginBtn" class="btn primary" href="/login.html" style="min-height:36px;padding:0 16px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;">登录</a>
        <button id="themeBtn" class="icon-btn" type="button" title="切换主题">🌓</button>
        <button id="logoutBtn" class="btn ghost" type="button" title="退出登录" hidden style="min-height:36px;padding:0 14px;font-size:13px;">退出</button>
      </div>
  </header>

  <!-- 新增 / 编辑 -->
  <section id="addPanel" class="panel" hidden>
    <div class="panel-head"><h2 id="addPanelTitle">新增学习记录</h2><button id="cancelEditBtn" class="btn ghost" type="button" hidden style="min-height:32px;padding:0 12px;font-size:13px;">取消编辑</button></div>
    <div class="field">
      <div id="newContent" class="editor" contenteditable="true" data-placeholder="今天学了什么？记录一下吧…（支持粘贴/插入图片）"></div>
    </div>
    <div class="field">
      <input id="imgInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div style="display:flex;gap:8px;">
        <button id="pickImgBtn" class="btn ghost" type="button">插入图片</button>
        <button id="pickEmojiBtn" class="btn ghost" type="button" title="插入 emoji">😀</button>
      </div>
      <button id="addBtn" class="btn primary" type="button">添加记录</button>
    </div>
    <div id="addMsg" class="msg" style="text-align:right;"></div>
  </section>

  <!-- 筛选 -->
  <section class="panel">
    <div class="panel-head"><h2>查询筛选</h2></div>
    <div class="filter-bar">
      <div class="field">
        <label><span>角色 / 内容</span><input id="fUser" placeholder="按角色名或记录内容模糊搜索"></label>
      </div>
      <div class="field date">
        <label><span>起始日期</span><input id="fFrom" type="date"></label>
      </div>
      <div class="field date">
        <label><span>截止日期</span><input id="fTo" type="date"></label>
      </div>
      <button id="searchBtn" class="btn primary" type="button">查询</button>
      <button id="resetBtn" class="btn ghost" type="button">重置</button>
    </div>
  </section>

  <!-- 统计 -->
  <section class="panel" id="statsPanel">
    <div class="panel-head">
      <h2>学习统计</h2>
      <span id="statsTotal" class="record-time"></span>
    </div>
    <h3 class="stats-sub">提交排行</h3>
    <div id="rankList" class="rank-list"></div>
    <h3 class="stats-sub">关键词词云</h3>
    <canvas id="cloudCanvas" class="cloud-canvas"></canvas>
  </section>

  <!-- 列表 -->
  <section>
    <div class="panel-head" style="margin-bottom:12px;">
      <h2>学习动态</h2>
      <span id="countInfo" class="record-time"></span>
    </div>
    <div id="recordList" class="record-list"></div>
    <span id="verTag" class="ver-tag"></span>
  </section>
</div>

<!-- 更新日志弹窗 -->
<div id="updateModal" class="modal-mask" hidden>
  <div class="modal-card">
    <h2 id="updateTitle">更新日志</h2>
    <ul id="updateNotes"></ul>
    <button id="updateOk" class="btn primary" type="button">我知道了</button>
  </div>
</div>

<!-- emoji 选择面板 -->
<div id="emojiPanel" class="emoji-panel" hidden></div>

<script>
const API = "";
const PALETTE = ["4a90d9","e74c3c","27ae60","f39c12","9b59b6","1abc9c","e67e22","34495e","d35400","8e44ad","16a085","c0392b","2980b9","f1c40f","7f8c8d"];
let token = localStorage.getItem("studylog_token") || "";
let currentUser = localStorage.getItem("studylog_user") || "";
let isAdmin = localStorage.getItem("studylog_admin") === "1";
let myColor = "";

function authHeaders() {
  return token ? { "Authorization": "Bearer " + token } : {};
}

async function request(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, authHeaders(), opts.headers || {});
  const res = await fetch(API + path, Object.assign({ headers }, opts));
  return await res.json();
}

function updateAuthUI() {
  const loggedIn = !!token;
  const tag = document.getElementById("userTag");
  tag.textContent = (isAdmin ? "👑 " : "") + currentUser;
  tag.title = isAdmin ? "管理员（可删除任意记录/留言）" : "";
  tag.hidden = !loggedIn;

let records = [];
let filter = { q: "", from: "", to: "" };
let activeReply = null; // {rid: 记录ID, name: 被回复用户名}，普通留言时为 null

async function loadRecords() {
  const params = new URLSearchParams();
  if (filter.q) params.set("q", filter.q);
  if (filter.from) params.set("from", filter.from);
  if (filter.to) params.set("to", filter.to);

// ---------- 统计 ----------
async function loadStats() {
  try {
    const res = await request("/api/stats");
    if (!res.ok) return;
    renderRanking(res.ranking || [], res.total || 0);
    renderCloud(res.words || []);
  } catch (e) { /* 统计失败不影响主功能 */ }
}

function renderRanking(ranking, total) {
  document.getElementById("statsTotal").textContent = `共 ${total} 条记录`;
  const list = document.getElementById("rankList");
  if (!ranking.length) {
    list.innerHTML = '<div class="rank-empty">暂无数据</div>';
    return;
  }
  const max = Math.max(...ranking.map(r => r.count), 1);
  list.innerHTML = ranking.map((r, i) => {
    const pct = Math.max(4, Math.round(r.count / max * 100));
    const medal = i === 0 ? "🥇 " : i === 1 ? "🥈 " : i === 2 ? "🥉 " : "";
    return `
      <div class="rank-row">
        <span class="rank-name" style="color:#${r.color};">${medal}${esc(r.username)}</span>
        <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%;background:#${r.color};"></div></div>
        <span class="rank-count">${r.count} 条</span>
      </div>
    `;
  }).join("");
}

const CLOUD_COLORS = ["#4a90d9","#e74c3c","#27ae60","#f39c12","#9b59b6","#1abc9c","#e67e22","#16a085","#d35400","#8e44ad","#2980b9","#c0392b"];

function renderCloud(words) {
  const cv = document.getElementById("cloudCanvas");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 600, H = 320;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  if (!words.length) {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--muted") || "#888";
    ctx.font = '14px "Microsoft YaHei", sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("暂无数据", W / 2, H / 2);
    return;
  }
  const max = words[0].weight, min = words[words.length - 1].weight;
  const placed = [];
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    const t = max === min ? 1 : (w.weight - min) / (max - min);
    const size = 14 + t * 34; // 14~48px
    ctx.font = `700 ${size}px "Microsoft YaHei", sans-serif`;
    const tw = ctx.measureText(w.text).width, th = size;
    let ok = false, x = W / 2, y = H / 2;
    let angle = Math.random() * Math.PI * 2;
    for (let step = 0; step < 800; step++) {
      const r = step * 1.1;
      angle += 0.35;
      x = W / 2 + r * Math.cos(angle) * 1.4;
      y = H / 2 + r * Math.sin(angle);
      const rect = { x: x - tw / 2 - 3, y: y - th / 2 - 3, w: tw + 6, h: th + 6 };
      if (rect.x < 0 || rect.y < 0 || rect.x + rect.w > W || rect.y + rect.h > H) continue;
      let hit = false;
      for (const p of placed) {
        if (rect.x < p.x + p.w && p.x < rect.x + rect.w && rect.y < p.y + p.h && p.y < rect.y + rect.h) { hit = true; break; }
      }
      if (!hit) { placed.push(rect); ok = true; break; }
    }
    if (ok) {
      ctx.fillStyle = CLOUD_COLORS[i % CLOUD_COLORS.length];
      ctx.font = `700 ${size}px "Microsoft YaHei", sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(w.text, x, y);
    }
  }
}

function renderRecords() {
  const list = document.getElementById("recordList");
  document.getElementById("countInfo").textContent = `共 ${records.length} 条`;
  if (!records.length) {
    list.innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }
  list.innerHTML = records.map(r => {
    const dt = new Date(r.created_at);
    const timeStr = dt.toLocaleString("zh-CN", { hour12: false });
    const editStr = r.updated_at ? `（编辑于 ${new Date(r.updated_at).toLocaleString("zh-CN", { hour12: false })}）` : "";
    const color = r.color || "4a90d9";
    return `
      <article class="record ${r.mine ? "mine" : ""}" style="border-left-color:#${color};">
        <div class="record-head">
          <div class="record-user">
            <span class="role-tag" style="background:#${color}22;color:#${color};">${esc(r.username)}</span>
            ${r.mine ? '<span class="record-time">我</span>' : ""}
          </div>
          <span class="record-time" title="${r.updated_at ? "发布 " + timeStr + "，最后编辑 " + editStr.replace(/[（）]/g, "") : ""}">${timeStr}${editStr}</span>
        </div>
        <div class="record-content">${r.content || ""}</div>
        ${(r.mine || isAdmin) && token ? `<div class="record-actions">${r.mine ? `<button class="edit-btn" data-id="${r.id}" type="button">编辑</button>` : ""}<button class="del-btn" data-id="${r.id}" type="button">删除</button></div>` : ""}
        <div class="comments">
          ${(r.comments || []).map(c => `
            <div class="comment-item">
              <span class="role-tag" style="background:#${c.color}22;color:#${c.color};">${esc(c.username)}</span>
              ${c.reply_to ? `<span class="reply-badge">回复 <b>@${esc(c.reply_to)}</b></span>` : ""}
              <span class="comment-text">${esc(c.content)}</span>
              <span class="comment-time">${new Date(c.created_at).toLocaleString("zh-CN", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
              ${(c.mine || isAdmin) && token ? `<button class="comment-del" data-cid="${c.id}" type="button" title="删除留言">删除</button>` : ""}
              ${token && !c.mine ? `<button class="comment-reply" data-rid="${r.id}" data-name="${enc(c.username)}" type="button" title="回复这条留言">回复</button>` : ""}
            </div>
          `).join("")}
          ${token ? `
            <div class="reply-state" data-rid="${r.id}" ${activeReply && activeReply.rid === r.id ? "" : "hidden"}>
              回复 <b>@${activeReply && activeReply.rid === r.id ? esc(activeReply.name) : ""}</b>
              <button class="reply-cancel" data-rid="${r.id}" type="button" title="取消回复">✕</button>
            </div>
            <div class="comment-form">
              <input class="input comment-input" data-rid="${r.id}" placeholder="${activeReply && activeReply.rid === r.id ? "回复 @" + activeReply.name + "：" : "友善留言…"}" maxlength="2000">
              <button class="btn ghost emoji-open" type="button" title="插入 emoji">😀</button>
              <button class="btn comment-send" data-rid="${r.id}" type="button">留言</button>
            </div>
          ` : ""}
        </div>
      </article>
    `;
  }).join("");
  list.querySelectorAll(".del-btn").forEach(b => {
    b.onclick = () => delRecord(+b.dataset.id);
  });
  list.querySelectorAll(".edit-btn").forEach(b => {
    b.onclick = () => startEdit(+b.dataset.id);
  });
  list.querySelectorAll(".comment-send").forEach(b => {
    b.onclick = () => sendComment(+b.dataset.rid);
  });
  list.querySelectorAll(".comment-input").forEach(inp => {
    inp.onkeydown = e => { if (e.key === "Enter") sendComment(+inp.dataset.rid); };
  });
  list.querySelectorAll(".comment-del").forEach(b => {
    b.onclick = () => delComment(+b.dataset.cid);
  });
  list.querySelectorAll(".comment-reply").forEach(b => {
    b.onclick = () => startReply(+b.dataset.rid, decodeURIComponent(b.dataset.name));
  });
  list.querySelectorAll(".reply-cancel").forEach(b => {
    b.onclick = () => { activeReply = null; renderRecords(); };
  });
  list.querySelectorAll(".emoji-open").forEach(b => {
    b.onclick = e => {
      const input = b.closest(".comment-form").querySelector(".comment-input");
      toggleEmojiPanel(b, { kind: "input", el: input });
    };
  });
}

async function sendComment(rid) {
  const input = document.querySelector(`.comment-input[data-rid="${rid}"]`);
  if (!input) return;
  const content = input.value.trim();
  if (!content) return;
  const payload = { content };
  if (activeReply && activeReply.rid === rid) payload.reply_to = activeReply.name;
  const res = await request(`/api/records/${rid}/comments`, {
    method: "POST",
    body: JSON.stringify(payload),
  });
  if (res.ok) {
    input.value = "";
    activeReply = null;
    loadRecords();
  } else {
    alert(res.message || "留言失败");
  }
}

function startReply(rid, name) {
  activeReply = { rid, name };
  renderRecords();
  const input = document.querySelector(`.comment-input[data-rid="${rid}"]`);
  if (input) {
    input.focus();
    input.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

async function delComment(cid) {
  if (!confirm("确定删除这条留言？")) return;
  const res = await request(`/api/comments/${cid}`, { method: "DELETE" });
  if (res.ok) loadRecords();
  else alert(res.message || "删除失败");
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function enc(s) { return encodeURIComponent(s); }

const ALLOWED_IMG = ["image/png", "image/jpeg", "image/gif", "image/webp"];

// ---------- emoji 选择器 ----------
const EMOJIS = [
  "😀","😄","😂","🤣","😊","😍","🥰","😎","🤓","🧐","🤔","😅","😭","😤","🥳","😴",
  "👍","👎","👏","🙏","💪","🤝","✌️","🫶","❤️","🔥","✨","⭐","🎉","🎊","💯","🌟",
  "📚","📖","✏️","📝","💡","🧠","🔍","📌","📅","⏰","⌛","🚀","🎯","🏆","☕","🍵",
];
const emojiPanel = document.getElementById("emojiPanel");
emojiPanel.innerHTML = EMOJIS.map(e => `<button class="emoji-item" type="button" data-e="${e}">${e}</button>`).join("");

let emojiTarget = null;      // {kind:'editor'} 或 {kind:'input', el}
let emojiSavedRange = null;  // contenteditable 的选区备份

function toggleEmojiPanel(anchorBtn, target) {
  if (!emojiPanel.hidden && emojiTarget && emojiTarget.kind === target.kind && emojiTarget.el === target.el) {
    emojiPanel.hidden = true;
    emojiTarget = null;
    return;
  }
  emojiTarget = target;
  if (target.kind === "editor") {
    newContent.focus();
    const sel = window.getSelection();
    if (sel && sel.rangeCount) emojiSavedRange = sel.getRangeAt(0).cloneRange();
  } else {
    target.el.focus();
  }
  emojiPanel.hidden = false;
  const rect = anchorBtn.getBoundingClientRect();
  const pw = Math.min(320, window.innerWidth * 0.92);
  let left = rect.left;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (left < 8) left = 8;
  let top = rect.bottom + 6;
  const ph = 280;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, rect.top - ph - 6);
  emojiPanel.style.left = left + "px";
  emojiPanel.style.top = top + "px";
  emojiPanel.style.maxHeight = ph + "px";
  emojiPanel.style.overflowY = "auto";
}

emojiPanel.addEventListener("click", e => {
  const b = e.target.closest(".emoji-item");
  if (!b || !emojiTarget) return;
  const emoji = b.dataset.e;
  if (emojiTarget.kind === "editor") {
    newContent.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    if (emojiSavedRange) {
      sel.addRange(emojiSavedRange);
    } else {
      const r = document.createRange();
      r.selectNodeContents(newContent); r.collapse(false);
      sel.addRange(r);
    }
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const node = document.createTextNode(emoji);
    range.insertNode(node);
    range.setStartAfter(node); range.setEndAfter(node);
    sel.removeAllRanges(); sel.addRange(range);
    emojiSavedRange = range.cloneRange();
  } else {
    const el = emojiTarget.el;
    const s = el.selectionStart ?? el.value.length;
    const t = el.selectionEnd ?? el.value.length;
    el.value = el.value.slice(0, s) + emoji + el.value.slice(t);
    el.focus();
    el.setSelectionRange(s + emoji.length, s + emoji.length);
  }
});

document.addEventListener("click", e => {
  if (emojiPanel.hidden) return;
  if (emojiPanel.contains(e.target)) return;
  if (e.target.closest(".emoji-open") || e.target.id === "pickEmojiBtn") return;
  emojiPanel.hidden = true;
  emojiTarget = null;
});

document.getElementById("pickEmojiBtn").onclick = function () {
  toggleEmojiPanel(this, { kind: "editor" });
};

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function insertImageAtCursor(src) {
  newContent.focus();
  const sel = window.getSelection();
  let range;
  if (sel && sel.rangeCount && newContent.contains(sel.anchorNode)) {
    range = sel.getRangeAt(0);
  } else {
    range = document.createRange();
    range.selectNodeContents(newContent);
    range.collapse(false);
  }
  range.deleteContents();
  const img = document.createElement("img");
  img.src = src;
  img.alt = "学习图片";
  range.insertNode(img);
  range.setStartAfter(img);
  range.setEndAfter(img);
  sel.removeAllRanges();
  sel.addRange(range);
}

async function insertImageFile(file) {
  if (!ALLOWED_IMG.includes(file.type)) {
    addMsg.className = "msg err"; addMsg.textContent = "仅支持 png/jpg/gif/webp"; return;
  }
  if (file.size > 5 * 1024 * 1024) {
    addMsg.className = "msg err"; addMsg.textContent = "图片不能超过 5MB"; return;
  }
  try {
    const b64 = await fileToBase64(file);
    insertImageAtCursor(b64);
  } catch (e) {
    addMsg.className = "msg err"; addMsg.textContent = "图片插入失败";
  }
}

// 粘贴图片
newContent.addEventListener("paste", async e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) {
      e.preventDefault();
      await insertImageFile(it.getAsFile());
      return;
    }
  }
});

// 点击编辑器内图片删除
newContent.addEventListener("click", e => {

  }
});

function sanitizeHtml(html) {
  const d = document.createElement("div");
  d.innerHTML = html;
  d.querySelectorAll("script,iframe,object,embed,link,style").forEach(n => n.remove());
  d.querySelectorAll("*").forEach(n => {
    [...n.attributes].forEach(a => {
      if (a.name.startsWith("on")) n.removeAttribute(a.name);
    });
  });
  return d.innerHTML;
}

function getEditorText() {
  return (newContent.innerText || newContent.textContent || "").trim();
}

// 编辑态
let editingId = null;
const addPanelTitle = document.getElementById("addPanelTitle");
const cancelEditBtn = document.getElementById("cancelEditBtn");

function startEdit(rid) {
  const rec = records.find(r => r.id === rid);
  if (!rec) return;
  editingId = rid;
  newContent.innerHTML = rec.content || "";
  addPanelTitle.textContent = "编辑记录";
  addBtn.textContent = "保存修改";
  cancelEditBtn.hidden = false;
  addMsg.textContent = "";
  document.getElementById("addPanel").scrollIntoView({ behavior: "smooth", block: "start" });
  newContent.focus();
}

function cancelEdit() {
  editingId = null;
  newContent.innerHTML = "";
  addPanelTitle.textContent = "新增学习记录";
  addBtn.textContent = "添加记录";
  cancelEditBtn.hidden = true;
  addMsg.textContent = "";
}
cancelEditBtn.onclick = cancelEdit;

addBtn.onclick = async () => {
  const hasText = getEditorText();
  const hasImg = newContent.querySelector("img");
  if (!hasText && !hasImg) {
    addMsg.className = "msg err"; addMsg.textContent = "内容不能为空"; return;
  }
  const html = sanitizeHtml(newContent.innerHTML);
  addBtn.disabled = true; addMsg.textContent = editingId ? "保存中…" : "添加中…"; addMsg.className = "msg";
  try {
    const res = await request(editingId ? "/api/records/" + editingId : "/api/records", {
      method: editingId ? "PUT" : "POST",
      body: JSON.stringify({ content: html }),
    });
    if (res.ok) {
      const wasEdit = !!editingId;
      cancelEdit();
      addMsg.className = "msg ok"; addMsg.textContent = wasEdit ? "已更新" : "已添加";
      loadRecords();
    } else {
      addMsg.className = "msg err"; addMsg.textContent = res.message || "操作失败";
    }
  } catch (e) {
    addMsg.className = "msg err"; addMsg.textContent = "网络错误";
  } finally {
    addBtn.disabled = false;
  }
};

async function delRecord(id) {
  if (!confirm("确定删除这条记录？")) return;
  const res = await request("/api/records/" + id, { method: "DELETE" });
  if (res.ok) loadRecords();
  else alert(res.message || "删除失败");
}

document.getElementById("searchBtn").onclick = () => {

  filter.from = document.getElementById("fFrom").value;
  filter.to = document.getElementById("fTo").value;
  loadRecords();
};
document.getElementById("resetBtn").onclick = () => {
  filter = { q: "", from: "", to: "" };
  document.getElementById("fUser").value = "";
  document.getElementById("fFrom").value = "";
  document.getElementById("fTo").value = "";
  loadRecords();
};

// ---------- 版本 / 更新日志 ----------
// 用 localStorage 记录本浏览器已确认的版本；服务端版本变化时弹窗一次，确认后不再出现。
async function checkVersion() {
  try {
    const res = await request("/api/version");
    if (!res.ok || !res.version) return;
    document.getElementById("verTag").textContent = "v" + res.version;
    if (localStorage.getItem("studylog_seen_version") !== res.version) {
      document.getElementById("updateTitle").textContent = `v${res.version} 更新日志`;
      document.getElementById("updateNotes").innerHTML =
        (res.notes || []).map(n => `<li>${esc(n)}</li>`).join("");
      const modal = document.getElementById("updateModal");
      modal.hidden = false;
      document.getElementById("updateOk").onclick = () => {
        modal.hidden = true;
        localStorage.setItem("studylog_seen_version", res.version);
      };
    }
  } catch (e) { /* 版本检查失败不影响主功能 */ }
}

// 启动
checkVersion();
if (token) {
  request("/api/me").then(res => {
    if (res.ok && res.username) {
      currentUser = res.username;
      myColor = res.color || "4a90d9";
      isAdmin = !!res.is_admin;
      localStorage.setItem("studylog_admin", isAdmin ? "1" : "0");
    } else {
      token = ""; currentUser = ""; myColor = ""; isAdmin = false;
      localStorage.removeItem("studylog_token");
      localStorage.removeItem("studylog_admin");
    }
    updateAuthUI();
    loadRecords();
  }).catch(() => { updateAuthUI(); loadRecords(); });
} else {
  updateAuthUI();
  loadRecords();
